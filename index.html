<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >
  <meta name="theme-color" content="#131318">
  <meta name="description" content="">
  <title>Immersive Scroll Music Engine</title>

  <style>
    /* =========================================================
       01. 基础样式与设计变量
       不使用滚动吸附，不劫持滚轮。
       每个区块占一屏，区块数量由 songs 数组决定。
       ========================================================= */
    :root {
      color-scheme: dark;
      --paper: #f3f0ed;
      --muted: #b4b0bc;
      --accent: #cec4e3;
      --screen-height: 100vh;
      --disc-size: min(32vw, 440px);
      --lyric-row: 64px;
      --background-blur: 15px;
      --background-brightness: 0.5;

      font-family:
        "Microsoft YaHei",
        "PingFang SC",
        sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: #131318;
      scrollbar-width: none;
    }

    html::-webkit-scrollbar {
      display: none;
    }

    body {
      margin: 0;
      color: var(--paper);
      overflow-x: clip;
    }

    button,
    input {
      font: inherit;
    }

    button {
      padding: 0;
      border: 0;
      color: inherit;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:disabled {
      opacity: 0.3;
      cursor: default;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 6px;
    }

    svg {
      display: block;
    }

    [hidden] {
      display: none !important;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      margin: -1px;
      padding: 0;
      overflow: hidden;
      clip-path: inset(50%);
      white-space: nowrap;
    }

    /* =========================================================
       02. 双背景层
       图片、渐变、视频统一在父层应用滤镜。
       opacity 不设置 transition，完全绑定滚动距离。
       ========================================================= */
    .background {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-layer {
      position: absolute;
      inset: 0;
      overflow: hidden;

      background-color: #131318;
      background-position: center;
      background-size: cover;
      background-repeat: no-repeat;

      opacity: 0;
      filter: brightness(var(--background-brightness));

      transform: scale(1);
      transform-origin: center;
      will-change: opacity, transform;
    }

    .background-video {
      position: absolute;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .atmosphere {
      position: absolute;
      inset: 0;
      z-index: 2;
      background:
        radial-gradient(
          ellipse at 48% 45%,
          transparent 20%,
          rgba(9, 8, 15, 0.4) 100%
        );
    }

    .atmosphere::after {
      content: "";
      position: absolute;
      inset: 0;
      opacity: 0.035;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Cpath fill='%23fff' filter='url(%23n)' d='M0 0h180v180H0z'/%3E%3C/svg%3E");
    }

    /* =========================================================
       03. 顶部与侧边导航
       ========================================================= */
    .masthead {
      position: fixed;
      inset: 0 0 auto;
      z-index: 20;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;

      padding: 32px 4.5vw;
      pointer-events: none;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      max-width: 75%;
    }

    .brand-mark {
      width: 29px;
      height: 29px;
      flex-shrink: 0;
    }

    .brand-name {
      min-width: 0;
      overflow: hidden;
      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(16px, 1.7vw, 23px);
      letter-spacing: 0.06em;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .room-label {
      flex-shrink: 0;
      color: #d0cbd7;
      font-size: 11px;
      letter-spacing: 0.15em;
    }

    .edition {
      color: var(--muted);
      font-size: 11px;
      text-align: right;
    }

    .track-nav {
      position: fixed;
      right: 3vw;
      top: 50%;
      z-index: 20;
      transform: translateY(-50%);

      display: grid;
      grid-auto-rows: 27px;
      gap: 8px;

      max-height: 65vh;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: none;
    }

    .track-nav::-webkit-scrollbar {
      display: none;
    }

    .track-nav button {
      display: grid;
      place-items: center;
      width: 28px;
      height: 27px;
      background: none;
    }

    .track-nav button::before {
      content: "";
      width: 4px;
      height: 4px;
      border-radius: 10px;
      background: #b4b0bc70;
      transition: height 0.25s, background-color 0.25s;
    }

    .track-nav button[aria-current="true"]::before {
      height: 23px;
      background: var(--paper);
    }

    .track-nav button:hover::before {
      background: var(--paper);
    }

    /* =========================================================
       04. N 个全屏唱片区块
       奇数唱片在左，偶数唱片在右。
       ========================================================= */
    main {
      position: relative;
      z-index: 2;
    }

    .song-section {
      position: relative;
      display: flex;
      align-items: center;

      height: var(--screen-height);
      padding: 0 10vw;
      isolation: isolate;
    }

    .song-section:nth-child(even) {
      flex-direction: row-reverse;
    }

    .song-section:not(:first-child)::before {
      content: "";
      position: absolute;
      inset: 0 0 auto;
      height: 1px;
      background:
        linear-gradient(
          90deg,
          transparent,
          #ffffff26,
          transparent
        );
    }

    .song-section::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background:
        linear-gradient(
          180deg,
          #ffffff04,
          transparent 24%,
          #00000008
        );
    }

    .turntable {
      position: relative;
      width: var(--disc-size);
      flex: 0 0 var(--disc-size);
    }

    .record-number {
      position: absolute;
      top: -90px;
      left: -24px;
      z-index: -1;

      color: #ffffff08;
      font-family: Georgia, serif;
      font-size: 170px;
      font-style: italic;
      line-height: 1;
      pointer-events: none;
    }

    .record-button {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1;
      border-radius: 50%;
      background: transparent;

      box-shadow:
        0 28px 60px #0007,
        0 2px 4px #000a;
    }

    .vinyl {
      position: absolute;
      inset: 0;
      overflow: hidden;
      border: 2px solid #36363b;
      border-radius: 50%;

      background:
        repeating-radial-gradient(
          circle,
          #111115 0,
          #111115 1px,
          #26262b 1.5px,
          #111115 2.5px,
          #18181c 3px
        );

      animation: revolve 22s linear infinite;
      animation-play-state: paused;
    }

    .vinyl::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background:
        conic-gradient(
          from 15deg,
          transparent,
          #ffffff16 40deg,
          transparent 65deg,
          transparent 160deg,
          #ffffff1c 195deg,
          transparent 220deg
        );
    }

    .vinyl::after {
      content: "";
      position: absolute;
      inset: 5.5%;
      border: 1px solid #ffffff15;
      border-radius: 50%;
    }

    .cover-label {
      position: absolute;
      inset: 28%;
      overflow: hidden;
      border: 6px solid #060608;
      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 30%,
          #ac9bb8,
          #4b435b 58%,
          #252030
        );

      box-shadow: 0 0 0 1px #ffffff20;
    }

    .cover-label img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .cover-label img[data-failed] {
      visibility: hidden;
    }

    .spindle {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 2;

      width: 11px;
      height: 11px;
      transform: translate(-50%, -50%);

      border-radius: 50%;
      background:
        radial-gradient(
          circle at 30% 30%,
          #fff,
          #a7a6ad 40%,
          #37363d 75%
        );

      box-shadow: 0 0 0 4px #1119;
    }

    .disc-action {
      position: absolute;
      inset: 0;
      z-index: 3;

      display: grid;
      place-items: center;

      border-radius: inherit;
      background: #0002;
      opacity: 0;
      transition: opacity 0.2s;
    }

    .disc-action svg {
      width: 35px;
      height: 35px;
      filter: drop-shadow(0 2px 8px #000);
    }

    .record-button:hover .disc-action,
    .record-button:focus-visible .disc-action {
      opacity: 1;
    }

    .song-section.is-playing .vinyl {
      animation-play-state: running;
    }

    @keyframes revolve {
      to {
        transform: rotate(360deg);
      }
    }

    .tonearm {
      position: absolute;
      top: -10%;
      right: -16%;
      z-index: 5;

      width: 44%;
      height: 75%;

      overflow: visible;
      pointer-events: none;

      transform-origin: 72% 12%;
      transform: rotate(-24deg);
      filter: drop-shadow(7px 12px 6px #0009);

      transition:
        transform 0.8s cubic-bezier(.22, .61, .36, 1),
        filter 0.8s;
    }

    .song-section.is-playing .tonearm {
      transform: rotate(2deg);
      filter: drop-shadow(3px 4px 2px #0009);
    }

    .disc-caption {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;

      margin-top: 32px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
    }

    /* =========================================================
       05. 固定三行歌词
       标题和状态绝对定位，不改变歌词窗口几何位置。
       因此切歌、加载歌词不会导致滚动阈值抖动。
       ========================================================= */
    .lyrics-stage {
      position: fixed;
      inset: 0;
      z-index: 4;
      pointer-events: none;
    }

    .lyrics-panel {
      position: absolute;
      top: 50%;
      left: 56%;

      width: 35%;
      height: calc(var(--lyric-row) * 3);

      transform: translateY(-50%);
      text-align: left;
    }

    .lyrics-panel.on-left {
      left: 10%;
    }

    .track-heading {
      position: absolute;
      right: 0;
      bottom: calc(100% + 25px);
      left: 0;
    }

    .track-kind {
      margin: 0 0 13px;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.18em;
    }

    .track-title {
      margin: 0;
      overflow: hidden;

      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(27px, 2.6vw, 42px);
      font-weight: 400;

      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .track-artist {
      margin: 12px 0 0;
      overflow: hidden;

      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .lyrics-window {
      position: relative;
      height: 100%;
      overflow: hidden;
    }

    .lyrics-lines {
      height: 100%;
    }

    .lyric-line {
      display: flex;
      align-items: center;

      height: var(--lyric-row);
      margin: 0;
      overflow: hidden;

      color: #f3f0ed55;
      font-size: clamp(15px, 1.35vw, 20px);
      line-height: 1.5;

      text-shadow: 0 0 16px #cec4e32b;
      white-space: nowrap;
    }

    .lyric-line.current {
      color: var(--paper);
      font-size: clamp(21px, 2.05vw, 31px);
      font-weight: 500;
      text-shadow: 0 0 23px #ddd2fa60;
    }

    .lyric-line span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .instrumental {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;

      height: 100%;
      text-align: center;
    }

    .instrumental h2 {
      max-width: 100%;
      margin: 0;
      overflow: hidden;

      font-family: Georgia, "Songti SC", "SimSun", serif;
      font-size: clamp(28px, 3vw, 46px);
      font-weight: 400;

      white-space: nowrap;
      text-overflow: ellipsis;
      text-shadow: 0 0 24px #cec4e344;
    }

    .instrumental p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: 0.16em;
    }

    .lyric-status {
      position: absolute;
      top: calc(100% + 20px);
      right: 0;
      left: 0;

      margin: 0;
      color: #c8c2d080;
      font-size: 11px;
      line-height: 1.6;
    }

    /* =========================================================
       06. 播放控制与频谱
       ========================================================= */
    .player {
      position: fixed;
      right: 4.5vw;
      bottom: max(30px, env(safe-area-inset-bottom));
      left: 4.5vw;
      z-index: 20;

      display: flex;
      align-items: center;
      gap: 26px;
    }

    .now-playing {
      display: flex;
      align-items: center;
      gap: 13px;

      width: 190px;
      min-width: 0;
      flex-shrink: 0;
    }

    .equalizer {
      display: flex;
      align-items: center;
      gap: 3px;
      height: 19px;
      flex-shrink: 0;
    }

    .equalizer i {
      display: block;
      width: 2px;
      height: 5px;
      background: var(--accent);
      transition: height 0.3s;
    }

    body.is-playing .equalizer i:nth-child(1) {
      height: 10px;
    }

    body.is-playing .equalizer i:nth-child(2) {
      height: 19px;
    }

    body.is-playing .equalizer i:nth-child(3) {
      height: 14px;
    }

    .now-title {
      max-width: 145px;
      margin: 0;
      overflow: hidden;
      font-size: 12px;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .now-subtitle {
      margin: 5px 0 0;
      color: var(--muted);
      font-size: 10px;
    }

    .transport {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon-button {
      display: grid;
      place-items: center;
      width: 32px;
      height: 38px;
      padding: 4px;
      background: transparent;
    }

    .icon-button svg {
      width: 18px;
      height: 18px;
    }

    .play-button {
      width: 44px;
      height: 44px;
      border: 1px solid #ffffff40;
      border-radius: 50%;
    }

    .timeline {
      display: flex;
      align-items: center;
      gap: 14px;
      min-width: 0;
      flex: 1;
    }

    .time {
      min-width: 32px;
      color: #ddd8e2;
      font-size: 10px;
      font-variant-numeric: tabular-nums;
    }

    input[type="range"] {
      --fill: 0%;
      appearance: none;
      -webkit-appearance: none;

      height: 2px;
      padding: 0;
      border: 0;
      border-radius: 0;

      background:
        linear-gradient(
          to right,
          var(--paper) var(--fill),
          #ffffff24 var(--fill)
        );

      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      appearance: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--paper);
    }

    input[type="range"]::-moz-range-thumb {
      width: 9px;
      height: 9px;
      border: 0;
      border-radius: 50%;
      background: var(--paper);
    }

    #seek {
      width: 100%;
      min-width: 30px;
    }

    .volume-control {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #volume {
      width: 65px;
    }

    .track-counter {
      color: var(--muted);
      font-size: 12px;
      letter-spacing: 0.1em;
      white-space: nowrap;
    }

    .track-counter strong {
      color: var(--paper);
      font-size: 18px;
      font-weight: 400;
    }

    .music-spectrum {
      position: absolute;
      left: 0;
      bottom: calc(100% + 18px);

      display: block;
      width: 100%;
      height: 36px;

      pointer-events: none;
      opacity: 0.75;
    }

    .scroll-hint {
      position: fixed;
      bottom: 125px;
      left: 50%;
      z-index: 6;
      transform: translateX(-50%);

      color: #d8d1df88;
      font-size: 10px;
      letter-spacing: 0.15em;
      white-space: nowrap;
      pointer-events: none;
    }

    .toast {
      position: fixed;
      bottom: 125px;
      left: 50%;
      z-index: 30;

      max-width: 85vw;
      padding: 12px 20px;
      transform: translateX(-50%);

      border: 1px solid #ffffff20;
      border-radius: 6px;
      background: #17151eef;

      font-size: 12px;
      line-height: 1.7;
    }

    .setup-message {
      display: grid;
      place-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 12vw;
      color: var(--muted);
      text-align: center;
      line-height: 1.8;
    }

    /* =========================================================
       07. 点击涟漪与光标隐藏
       ========================================================= */
    .click-ripple {
      position: fixed;
      z-index: 9999;

      width: 24px;
      height: 24px;
      border: 1px solid rgba(210, 238, 255, 0.65);
      border-radius: 50%;

      background:
        radial-gradient(
          circle,
          rgba(240, 250, 255, 0.3),
          rgba(190, 225, 255, 0.12) 45%,
          transparent 72%
        );

      box-shadow: 0 0 10px rgba(195, 230, 255, 0.24);
      pointer-events: none;
      user-select: none;

      animation: ripple-expand 650ms ease-out forwards;
    }

    @keyframes ripple-expand {
      from {
        transform: translate(-50%, -50%) scale(0.2);
        opacity: 0.8;
      }

      to {
        transform: translate(-50%, -50%) scale(7);
        opacity: 0;
      }
    }

    body.cursor-hidden,
    body.cursor-hidden * {
      cursor: none !important;
    }

    /* =========================================================
       08. 移动端
       ========================================================= */
    @media (max-width: 768px) {
      :root {
        --disc-size: min(56vw, 285px);
        --lyric-row: 44px;
      }

      .masthead {
        padding:
          max(23px, env(safe-area-inset-top))
          7vw
          0;
      }

      .brand {
        max-width: 100%;
      }

      .brand-name {
        font-size: 17px;
      }

      .brand-mark {
        width: 24px;
        height: 24px;
      }

      .room-label,
      .edition {
        display: none;
      }

      .song-section,
      .song-section:nth-child(even) {
        flex-direction: column;
        justify-content: flex-start;
        padding: 0;
      }

      .turntable {
        margin-top: calc(var(--screen-height) * 0.17);
      }

      .record-number {
        top: -48px;
        left: -30px;
        font-size: 110px;
      }

      .disc-caption {
        margin-top: 17px;
        font-size: 9px;
      }

      .lyrics-panel,
      .lyrics-panel.on-left {
        top: 70%;
        left: 10%;
        width: 80%;
        text-align: center;
      }

      .track-heading {
        bottom: calc(100% + 12px);
      }

      .track-kind {
        display: none;
      }

      .track-title {
        font-size: 23px;
      }

      .track-artist {
        margin-top: 7px;
        font-size: 10px;
      }

      .lyric-line {
        justify-content: center;
        font-size: 13px;
      }

      .lyric-line.current {
        font-size: clamp(17px, 4.8vw, 23px);
      }

      .lyric-status {
        top: calc(100% + 7px);
        font-size: 10px;
      }

      .instrumental h2 {
        font-size: 30px;
      }

      .instrumental p {
        font-size: 12px;
      }

      .track-nav {
        right: 2vw;
        grid-auto-rows: 23px;
        gap: 2px;
      }

      .track-nav button {
        width: 20px;
        height: 23px;
      }

      .player {
        right: 7vw;
        bottom: max(20px, env(safe-area-inset-bottom));
        left: 7vw;
        flex-wrap: wrap;
        gap: 12px;
      }

      .now-playing {
        width: auto;
        flex: 1;
      }

      .transport {
        gap: 8px;
      }

      .play-button {
        width: 37px;
        height: 37px;
      }

      .timeline {
        order: 5;
        flex-basis: 100%;
        gap: 8px;
      }

      .volume-control {
        display: none;
      }

      .track-counter {
        font-size: 9px;
      }

      .track-counter strong {
        font-size: 14px;
      }

      .music-spectrum {
        bottom: calc(100% + 12px);
        height: 22px;
      }

      .scroll-hint {
        display: none;
      }
    }

    @media (max-width: 768px) and (max-height: 680px) {
      :root {
        --disc-size: min(43vw, 205px);
        --lyric-row: 33px;
      }

      .turntable {
        margin-top: calc(var(--screen-height) * 0.16);
      }

      .lyrics-panel,
      .lyrics-panel.on-left {
        top: 67%;
      }

      .track-heading {
        bottom: calc(100% + 8px);
      }

      .track-title {
        font-size: 20px;
      }

      .track-artist {
        display: none;
      }

      .disc-caption {
        margin-top: 11px;
      }
    }

    @media (min-width: 769px) and (max-height: 580px) {
      :root {
        --disc-size: min(28vw, 60vh);
        --lyric-row: 40px;
      }

      .masthead {
        padding-top: 20px;
      }

      .track-heading {
        bottom: calc(100% + 10px);
      }

      .track-kind,
      .scroll-hint {
        display: none;
      }
    }

    /* 用户选择减少动态时，关闭非必要的持续动画 */
    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        transition: none !important;
      }

      .vinyl {
        animation: none;
      }

      .music-spectrum,
      .click-ripple {
        display: none;
      }

      .bg-layer {
        transform: none !important;
      }
    }
    /*
 * 原面板保留，供原有歌词逻辑和布局测量使用。
 * 不使用 display:none，避免测量高度失效。
 */
#lyrics-stage {
    visibility: hidden;
}

/* 歌词舞台：裁切范围由滚动位置决定。 */
.scroll-song-lyrics {
    visibility: visible;
    pointer-events: none;
    transition: none !important;
}

/* 标题舞台：独立于歌词裁切，通过滚动进度控制透明度。 */
.scroll-song-heading {
    visibility: visible;
    pointer-events: none;
    clip-path: none !important;
    transition: none !important;
}

.scroll-song-lyrics .lyrics-panel,
.scroll-song-heading .lyrics-panel {
    visibility: visible;
    opacity: 1 !important;
    transition: none !important;
}
  </style>
</head>

  <script>
    "use strict";

    /* =========================================================

    const siteConfig = {

      },

      },

      text: {

        lyricsPanel: "当前歌曲歌词",
        navigation: "选择歌曲",
        player: "音乐播放器",

        play: "播放",
        pause: "暂停",
        previous: "上一首",
        next: "下一首",
        mute: "静音",
        unmute: "取消静音",
